<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cửa hàng của Thy — Giỏ hàng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B3A}a:hover{color:#143F28}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F7F5EE; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #1C1C18">

  <div style="padding: 16px 12px 8px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Quay lại cửa hàng" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1C1C18">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 19px; font-weight: 700">Giỏ hàng</h1>
    <span style="margin-left: auto; padding-right: 8px; font-size: 13px; color: #5E5E56">{{ countText }}</span>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 8px 20px 120px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECE9DF; padding: 4px 14px">
      <sc-for list="{{ lines }}" as="l" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid {{l.divider}}">
          <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{l.bg}}; color: {{l.fg}}">
            <sc-if value="{{ l.isWater }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4v3l2 3v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8l2-3z"/><path d="M8 12h8"/></svg></sc-if>
            <sc-if value="{{ l.isSnack }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l1 4v12l-1 2H7l-1-2V7z"/><path d="M6 7h12M6 18h12"/><circle cx="12" cy="12.5" r="2.5"/></svg></sc-if>
            <sc-if value="{{ l.isCoconut }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><circle cx="9.5" cy="11" r="1"/><circle cx="14.5" cy="11" r="1"/><circle cx="12" cy="15" r="1"/></svg></sc-if>
            <sc-if value="{{ l.isEssential }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2 10H5z"/><path d="M8 10l4-6 4 6"/><path d="M9 14v3M15 14v3M12 14v3"/></svg></sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600; line-height: 1.35">{{ l.name }}</span>
            <span style="font-size: 12px; color: #5E5E56">{{ l.unit }}</span>
            <span style="font-size: 15px; font-weight: 700; color: #1E5B3A">{{ l.lineText }}</span>
          </div>
          <div style="display: flex; align-items: center; border-radius: 12px; border: 1px solid #E4E1D6">
            <button type="button" onClick="{{ l.sub }}" aria-label="Bớt một {{l.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1C18; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <span style="min-width: 18px; text-align: center; font-size: 15px; font-weight: 700">{{ l.qty }}</span>
            <button type="button" onClick="{{ l.add }}" aria-label="Thêm một {{l.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1C18; cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 28px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
          <span style="font-size: 15px; font-weight: 600">Giỏ hàng đang trống</span>
          <a href="Main.dc.html" style="font-size: 14px; font-weight: 600">Tiếp tục mua sắm</a>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Thời gian giao</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ times }}" as="t" hint-placeholder-count="2">
          <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="min-height: 64px; padding: 10px 14px; box-sizing: border-box; border-radius: 14px; background: {{t.bg}}; border: 1.5px solid {{t.bd}}; color: #1C1C18; font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{ t.name }}</span>
            <span style="font-size: 12px; color: #5E5E56">{{ t.sub }}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700">Thanh toán</legend>
      <div style="display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid #ECE9DF; padding: 2px 14px">
        <sc-for list="{{ pays }}" as="m" hint-placeholder-count="3">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; cursor: pointer; border-bottom: 1px solid {{m.divider}}">
            <input type="radio" name="pay" value="{{m.id}}" checked="{{ m.checked }}" onChange="{{ m.pick }}" style="width: 20px; height: 20px; margin: 0; accent-color: #1E5B3A">
            <span style="flex: 1; font-size: 14px; font-weight: 500">{{ m.name }}</span>
          </label>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="note" style="font-size: 16px; font-weight: 700">Ghi chú cho cửa hàng</label>
      <textarea id="note" rows="2" placeholder="Ví dụ: chọn dừa ướp lạnh, gọi trước khi giao" style="resize: none; padding: 12px 14px; border-radius: 14px; border: 1px solid #E4E1D6; background: #FFFFFF; font: inherit; font-size: 14px; color: #1C1C18"></textarea>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 18px; background: #EDEAE0">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #4A4A43">Tạm tính</span><span style="font-weight: 600">{{ subText }}</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #4A4A43">Phí giao hàng</span><span style="font-weight: 600">{{ feeText }}</span></div>
      <div style="height: 1px; background: #D9D5C8; margin: 2px 0"></div>
      <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 700"><span>Tổng cộng</span><span style="color: #1E5B3A">{{ totalText }}</span></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; background: #F7F5EE; border-top: 1px solid #E4E1D6">
    <button type="button" disabled="{{ empty }}" style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: #1E5B3A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Đặt hàng · {{ totalText }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      lines: [
        { id: 'w1', cat: 'water', name: 'Nước suối', unit: 'Chai 500ml', price: 5000, qty: 2 },
        { id: 'c1', cat: 'coconut', name: 'Dừa xiêm Bến Tre', unit: '1 trái', price: 18000, qty: 1 },
        { id: 's1', cat: 'snack', name: 'Bánh tráng trộn', unit: 'Túi 100g', price: 15000, qty: 1 }
      ],
      time: 'now',
      pay: 'cod'
    };
  }
  inc(id, d) {
    var lines = this.state.lines
      .map(function (l) { return l.id === id ? Object.assign({}, l, { qty: l.qty + d }) : l; })
      .filter(function (l) { return l.qty > 0; });
    this.setState({ lines: lines });
  }
  renderVals() {
    var self = this;
    var fmt = function (n) { return n.toLocaleString('vi-VN') + 'đ'; };
    var TINT = {
      water: ['#E3EFF6', '#1F5F86'], snack: ['#FBEBD9', '#9A4A12'],
      coconut: ['#E6F0DF', '#3D6B2A'], essential: ['#EFE9F5', '#5B4386']
    };
    var src = this.state.lines;
    var sub = 0, count = 0;
    var lines = src.map(function (l, i) {
      sub += l.qty * l.price; count += l.qty;
      return Object.assign({}, l, {
        bg: TINT[l.cat][0], fg: TINT[l.cat][1],
        isWater: l.cat === 'water', isSnack: l.cat === 'snack', isCoconut: l.cat === 'coconut', isEssential: l.cat === 'essential',
        lineText: fmt(l.qty * l.price),
        divider: i === src.length - 1 ? 'transparent' : '#F0EDE4',
        add: function () { self.inc(l.id, 1); },
        sub: function () { self.inc(l.id, -1); }
      });
    });
    var fee = count > 0 ? 15000 : 0;
    var times = [
      { id: 'now', name: 'Giao ngay', sub: 'Trong hôm nay' },
      { id: 'later', name: 'Hẹn giờ', sub: 'Chọn khung giờ' }
    ].map(function (t) {
      var on = self.state.time === t.id;
      return Object.assign({}, t, {
        bg: on ? '#E6F0DF' : '#FFFFFF', bd: on ? '#1E5B3A' : '#E4E1D6', pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ time: t.id }); }
      });
    });
    var PAYS = [
      { id: 'cod', name: 'Tiền mặt khi nhận hàng' },
      { id: 'bank', name: 'Chuyển khoản ngân hàng (QR)' },
      { id: 'wallet', name: 'Ví điện tử' }
    ];
    var pays = PAYS.map(function (m, i) {
      return Object.assign({}, m, {
        checked: self.state.pay === m.id,
        divider: i === PAYS.length - 1 ? 'transparent' : '#F0EDE4',
        pick: function () { self.setState({ pay: m.id }); }
      });
    });
    return {
      lines: lines,
      empty: count === 0,
      countText: count + ' món',
      times: times,
      pays: pays,
      subText: fmt(sub),
      feeText: fmt(fee),
      totalText: fmt(sub + fee)
    };
  }
}
</script>
</body>
</html>
